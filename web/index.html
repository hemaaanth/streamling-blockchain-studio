<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Streamling Blockchain Studio · Protocol SQL</title>
<style>
:root{color-scheme:light;--ink:#172019;--muted:#667066;--line:#d5dbd2;--paper:#f4f5ee;--panel:#fffef9;--accent:#23673d;--accent-hover:#174b2b;--code:#172019;--error:#a43b35}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}button,textarea{font:inherit}header{max-width:1280px;margin:auto;padding:22px 28px;display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid var(--line)}h1{font-size:17px;letter-spacing:.025em;margin:0}.status{display:flex;align-items:center;min-width:0;color:var(--muted);white-space:nowrap}.status-text{overflow:hidden;text-overflow:ellipsis}.dot{flex:0 0 auto;width:8px;height:8px;border-radius:50%;background:#ad973b;margin-right:9px}.dot.ok{background:#2d9651}.dot.error{background:var(--error)}main{max-width:1280px;margin:auto;padding:22px 28px 36px;display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;align-items:start}.card{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:8px}.schema{position:sticky;top:18px;overflow:hidden}.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:15px 16px 12px;border-bottom:1px solid var(--line)}h2{font-size:12px;text-transform:uppercase;letter-spacing:.09em;margin:0;color:var(--muted)}.count,.meta{font-size:11px;color:var(--muted)}#objects{max-height:520px;overflow:auto;padding:5px 8px}.schema-button{display:block;width:100%;border:0;border-radius:5px;background:transparent;text-align:left;padding:8px 9px;color:var(--ink);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.schema-button:hover,.schema-button:focus-visible{background:#e9eee6;outline:none}.schema-button.active{background:#dfe9de;color:#154627}.schema-foot{padding:12px 16px;border-top:1px solid var(--line)}.workspace{min-width:0;display:grid;gap:18px}.query-body{padding:15px}.editor-wrap{min-width:0;overflow:hidden;border-radius:6px;background:var(--code)}textarea{display:block;width:100%;min-height:168px;resize:vertical;border:0;outline:0;background:transparent;color:#edf3eb;padding:14px 16px;font-size:13px;line-height:1.55;white-space:pre;overflow:auto;tab-size:2}.query-actions{display:flex;align-items:center;gap:12px;min-width:0;margin-top:12px}.run{flex:0 0 auto;background:var(--accent);color:white;border:0;border-radius:5px;padding:9px 15px;font-weight:700;cursor:pointer}.run:hover{background:var(--accent-hover)}.run:disabled{opacity:.6;cursor:wait}#query-meta{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.result-card{overflow:hidden}.result-viewport{width:100%;max-height:560px;overflow:auto;overscroll-behavior:contain}.result-viewport pre{margin:0;padding:24px;color:var(--muted);white-space:pre-wrap}.result-viewport pre.error{color:var(--error)}table{border-collapse:separate;border-spacing:0;min-width:100%;width:max-content;font-size:12px;font-variant-numeric:tabular-nums}th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;max-width:360px;overflow:hidden;text-overflow:ellipsis}th{position:sticky;top:0;z-index:1;background:#f2f4ed;color:#4f594f;font-size:11px;text-transform:uppercase;letter-spacing:.04em}tbody tr:hover td{background:#f7f8f2}td.number{text-align:right}.empty{padding:24px;color:var(--muted)}code{font-family:inherit}@media(max-width:780px){header{padding:18px;align-items:flex-start;flex-direction:column;gap:8px}.status{width:100%}main{padding:16px 18px 28px;grid-template-columns:minmax(0,1fr)}.schema{position:static}.schema #objects{max-height:190px}.card-head{padding:13px 14px}.query-body{padding:12px}textarea{min-height:145px}.result-viewport{max-height:480px}th,td{max-width:260px}}
</style>
</head>
<body>
<header>
  <h1>Streamling Blockchain Studio / Protocol SQL</h1>
  <div class="status" role="status"><span id="dot" class="dot"></span><span id="status" class="status-text">Connecting to project…</span></div>
</header>
<main>
  <aside class="card schema">
    <div class="card-head"><h2>Event tables</h2><span id="table-count" class="count"></span></div>
    <div id="objects"><div class="empty">Waiting for schema…</div></div>
    <div class="schema-foot meta">MCP endpoint <code>POST /mcp</code></div>
  </aside>
  <section class="workspace">
    <div class="card">
      <div class="card-head"><h2>Query</h2><span class="meta">SQLite · read only</span></div>
      <div class="query-body">
        <div class="editor-wrap"><textarea id="sql" wrap="off" spellcheck="false">SELECT event_name, count(*) AS events
FROM events
GROUP BY event_name
ORDER BY events DESC
LIMIT 20</textarea></div>
        <div class="query-actions"><button class="run" id="run">Run SQL</button><div class="meta" id="query-meta">⌘/Ctrl + Enter to run</div></div>
      </div>
    </div>
    <div class="card result-card">
      <div class="card-head"><h2>Results</h2><span id="result-count" class="count"></span></div>
      <div id="result" class="result-viewport"><div class="empty">Run a read-only query to inspect indexed events.</div></div>
    </div>
  </section>
</main>
<script>
const $=selector=>document.querySelector(selector);
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const quoted=name=>name.replaceAll('"','""');
function setStatus(text,state=''){$('#status').textContent=text;$('#dot').className=`dot ${state}`.trim()}
async function load(){
  try{
    const response=await fetch('/api/status');
    if(!response.ok)throw new Error(`status returned ${response.status}`);
    const status=await response.json();
    const backfill=status.backfill||{};const progress=Number(backfill.progress_percent);const progressLabel=backfill.state==='caught_up'?'caught up':backfill.state==='backfilling'?`backfilling ${Number.isFinite(progress)?progress.toFixed(1)+'%':'—'} · ${Number(backfill.remaining_blocks||0).toLocaleString()} blocks left`:'not started';
    setStatus(`${status.chain} · ${status.contracts.map(contract=>contract.alias).join(', ')} · ${progressLabel}`,backfill.state==='caught_up'?'ok':'');
    if(!status.database_ready)return;
    const schemaResponse=await fetch('/api/schema');
    if(!schemaResponse.ok)throw new Error(`schema returned ${schemaResponse.status}`);
    const payload=await schemaResponse.json();
    const objects=payload.schema.objects.filter(object=>object.type==='table');
    $('#table-count').textContent=`${objects.length}`;
    $('#objects').innerHTML=objects.map(object=>`<button class="schema-button" data-table="${esc(object.name)}" title="${esc(object.name)}">${esc(object.name)}</button>`).join('');
    document.querySelectorAll('[data-table]').forEach(button=>button.addEventListener('click',()=>{
      document.querySelectorAll('.schema-button').forEach(item=>item.classList.remove('active'));
      button.classList.add('active');
      $('#sql').value=`SELECT *\nFROM "${quoted(button.dataset.table)}"\nORDER BY block_number DESC, log_index DESC\nLIMIT 50`;
      $('#sql').focus();
    }));
  }catch(error){setStatus('Studio API unavailable — restart `streamling-blockchain serve`','error');$('#objects').innerHTML='<div class="empty">Could not load the live schema.</div>'}
}
async function run(){
  const button=$('#run');
  const start=performance.now();
  button.disabled=true;
  button.textContent='Running…';
  $('#result').innerHTML='<div class="empty">Querying the local index…</div>';
  $('#result-count').textContent='';
  try{
    const response=await fetch('/api/sql',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({sql:$('#sql').value,max_rows:500})});
    const payload=await response.json();
    if(!response.ok)throw new Error(payload.error);
    const columns=payload.columns||[];
    if(!payload.rows.length){$('#result').innerHTML='<div class="empty">Query returned no rows.</div>'}
    else{
      $('#result').innerHTML=`<table><thead><tr>${columns.map(column=>`<th>${esc(column)}</th>`).join('')}</tr></thead><tbody>${payload.rows.map(row=>`<tr>${columns.map(column=>{const value=typeof row[column]==='object'?JSON.stringify(row[column]):row[column];const numeric=typeof row[column]==='number';return `<td class="${numeric?'number':''}" title="${esc(value)}">${esc(value)}</td>`}).join('')}</tr>`).join('')}</tbody></table>`;
    }
    const elapsed=Math.round(performance.now()-start);
    $('#result-count').textContent=`${payload.rows.length}${payload.truncated?'+' : ''} rows`;
    $('#query-meta').textContent=`${elapsed} ms${payload.truncated?' · first 500 rows':''}`;
  }catch(error){$('#result').innerHTML=`<pre class="error">${esc(error.message)}</pre>`;$('#query-meta').textContent='Query failed'}
  finally{button.disabled=false;button.textContent='Run SQL'}
}
$('#run').addEventListener('click',run);
$('#sql').addEventListener('keydown',event=>{if((event.metaKey||event.ctrlKey)&&event.key==='Enter'){event.preventDefault();run()}});
load();
</script>
</body>
</html>
