[package]
name = "streamling-blockchain-plugin"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
description = "Native Streamling EVM event source and SQLite sink"

[lib]
name = "streamling_blockchain_plugin"
crate-type = ["cdylib", "rlib"]

[dependencies]
abi_stable = "0.11.3"
arrow = "58.3.0"
arrow-schema = { version = "58.3.0", default-features = false }
async-trait = "0.1"
ethers-core = "2.0"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
streamling-plugin = "0.2.1"
tokio = { version = "1", features = ["rt-multi-thread"] }
tracing = "0.1"
